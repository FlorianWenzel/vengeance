name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/florianwenzel/vengeance
  TRIVY_IMAGE: aquasec/trivy:0.76.2

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: vengeance
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Placeholder UI (the real one is built in the web job)
        run: mkdir -p web/dist && echo '<!doctype html><title>Vengeance</title>' > web/dist/index.html
      - run: go vet ./...
      - run: go test -p 1 -race -count=1 ./...
        env:
          VENGEANCE_TEST_DATABASE_URL: postgres://postgres:pg@localhost:5432/vengeance?sslmode=disable

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Wait for Vengeance
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/readyz && exit 0; sleep 2; done
          docker compose logs; exit 1
      - working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color > compose.log; tail -200 compose.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            compose.log
          retention-days: 7

  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [e2e]
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v4
      - name: Sign the image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Scan the image and report to Vengeance
        env:
          VENGEANCE_URL: ${{ vars.VENGEANCE_URL }}
          VENGEANCE_TOKEN: ${{ secrets.VENGEANCE_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD -v "$PWD:/out" "$TRIVY_IMAGE" image --quiet --scanners vuln,secret -f json -o /out/image.json "${IMAGE}@${DIGEST}"
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs --quiet --scanners vuln,secret,misconfig -f json -o /src/repo.json /src
          if [ -z "$VENGEANCE_TOKEN" ] || [ -z "$VENGEANCE_URL" ]; then echo "No VENGEANCE_TOKEN/VENGEANCE_URL configured, skipping upload"; exit 0; fi
          docker run --rm --entrypoint vengeance -e VENGEANCE_URL -e VENGEANCE_TOKEN -v "$PWD:/w" "${IMAGE}@${DIGEST}" \
            push --asset "image:${IMAGE}" --project vengeance --scanners vuln,secret --digest "$DIGEST" /w/image.json
          docker run --rm --entrypoint vengeance -e VENGEANCE_URL -e VENGEANCE_TOKEN -v "$PWD:/w" "${IMAGE}@${DIGEST}" \
            push --asset "repository:github.com/${GITHUB_REPOSITORY}" --project vengeance --scanners vuln,secret,misconfig /w/repo.json
