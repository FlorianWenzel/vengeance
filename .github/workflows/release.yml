name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: WASM toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          V=$(grep -m1 -oE 'wasm-bindgen = "=?[0-9.]+"' viz/Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          F=wasm-bindgen-$V-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLo /tmp/$F "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$V/$F"
          echo "$(curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$V/$F.sha256sum" | cut -d' ' -f1)  /tmp/$F" | sha256sum -c -
          tar -xzf /tmp/$F -C /tmp
          sudo install -m 0755 /tmp/wasm-bindgen-$V-x86_64-unknown-linux-musl/wasm-bindgen /usr/local/bin/
      - uses: sigstore/cosign-installer@v4.1.3
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
