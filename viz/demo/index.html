<!doctype html>
<!--
  Standalone dev harness for the blueprint renderer. Not used by the app.
  Build:  scripts/build-viz.sh
  Serve:  python3 -m http.server 8765   (from the repo root)
  Open:   http://localhost:8765/viz/demo/          ?focus=<id>  ?scene=<url>  ?reduced=1
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueprint demo</title>
<style>
  :root { --ink: #cfe9ff; --dim: #6f8fb3; --amber: #ffb547; }
  html, body { margin: 0; height: 100%; background: #07101e; color: var(--ink);
    font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
  #wrap { position: absolute; inset: 0; }
  canvas { width: 100%; height: 100%; display: block; outline: none; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .lb { position: absolute; white-space: nowrap; text-shadow: 0 0 3px #07101e, 0 0 6px #07101e; }
  .lb b { font-weight: 600; letter-spacing: .02em; }
  .lb i { display: block; font-style: normal; color: var(--dim); font-size: 10.5px; }
  .lb.above { transform: translate(-50%, -100%); text-align: center; }
  .lb.right { transform: translate(0, -50%); }
  .lb.inside { transform: translate(0, 2px); font-size: 10.5px; }
  .lb.below { transform: translate(-50%, 6px); text-align: center; font-size: 10px; }
  .lb.host b { font-size: 13px; }
  .lb.sel b { color: var(--amber); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
  #hud { position: absolute; left: 12px; bottom: 10px; color: var(--dim); }
  #err { position: absolute; inset: 0; display: none; place-items: center; color: #ff8a3d; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" tabindex="0"></canvas>
  <div id="labels"></div>
  <div id="hud"></div>
  <div id="err"></div>
</div>
<script type="module">
  import init, { Blueprint } from '../../web/src/viz/pkg/blueprint.js';
  const colors = { p1: '#ff4d5e', p2: '#ff8a3d', p3: '#ffd166', p4: '#7da7d9', ok: '#3ddc97', unknown: '#5b6478' };
  const q = new URLSearchParams(location.search);
  const canvas = document.getElementById('c');
  const labelsEl = document.getElementById('labels');
  const hud = document.getElementById('hud');
  await init();
  let bp;
  try { bp = new Blueprint(canvas); } catch (e) {
    const el = document.getElementById('err'); el.style.display = 'grid'; el.textContent = String(e.message || e); throw e;
  }
  window.bp = bp;
  const scene = await (await fetch(q.get('scene') || '../fixtures/scene.json')).text();
  const resize = () => { const r = canvas.getBoundingClientRect(); bp.resize(r.width, r.height, devicePixelRatio); };
  resize();
  new ResizeObserver(resize).observe(canvas);
  bp.set_reduced_motion(q.get('reduced') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches);
  bp.set_scene(scene);
  if (q.get('focus')) bp.focus(q.get('focus'));

  const pos = (e) => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); canvas.focus(); bp.pointer_down(...pos(e), e.button); });
  canvas.addEventListener('pointermove', (e) => bp.pointer_move(...pos(e)));
  canvas.addEventListener('pointerup', (e) => bp.pointer_up(...pos(e), e.button));
  canvas.addEventListener('pointerleave', () => bp.pointer_move(-1, -1));
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); bp.wheel(e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY, ...pos(e)); }, { passive: false });
  canvas.addEventListener('keydown', (e) => { if (e.code.startsWith('Arrow') || e.code === 'Escape') e.preventDefault(); bp.key(e.code); });

  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let last = '';
  const loop = (t) => {
    bp.frame(t);
    const json = bp.labels();
    if (json !== last) {
      last = json;
      labelsEl.innerHTML = JSON.parse(json).map((l) =>
        `<div class="lb ${l.anchor} ${l.kind}${l.selected ? ' sel' : ''}" style="left:${l.x}px;top:${l.y}px;opacity:${(1 - l.depth * 0.25).toFixed(2)}">` +
        `<b><span class="dot" style="background:${colors[l.level]}"></span>${esc(l.text)}</b>` +
        (l.sub && (l.selected || l.hovered) ? `<i>${esc(l.sub)}</i>` : '') + `</div>`).join('');
    }
    hud.textContent = `hover ${bp.hovered() ?? '-'}   selected ${bp.selected() ?? '-'}`;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  window.blueprintReady = true;
</script>
</body>
</html>
